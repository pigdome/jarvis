name: Build and Release

on:
  push:
    tags:
      - 'v*' # Trigger on tags like v0.16.0

jobs:
  release:
    name: Build & Release for Linux (Universal Compatibility)
    # Build on Ubuntu 22.04 host, but compile inside a Debian 10 (glibc 2.28) container.
    # PyInstaller bundles libpython linked against the build machine's glibc, and glibc
    # is forward-compatible only (old glibc can't satisfy a binary built against new glibc).
    # Building against glibc 2.28 makes the binary run on Debian 10/11, Ubuntu 20.04/22.04+, etc.
    runs-on: ubuntu-22.04
    permissions:
      contents: write # Needed to create releases

    steps:
      - name: 🔍 Checkout Code
        uses: actions/checkout@v4

      - name: 🚀 Build Executable with PyInstaller (in Debian 10 container)
        run: |
          docker run --rm -v "${{ github.workspace }}":/repo -w /repo debian:10 bash -lc '
            set -e
            trap '\''echo "Container build failed at line $LINENO: $BASH_COMMAND" >&2'\'' ERR
            export DEBIAN_FRONTEND=noninteractive
            # Debian 10 (buster) is EOL and removed from the regular mirrors; use the archive instead.
            sed -i "s|deb.debian.org|archive.debian.org|g; s|security.debian.org|archive.debian.org|g" /etc/apt/sources.list
            echo "Acquire::Check-Valid-Until \"false\";" > /etc/apt/apt.conf.d/99no-check-valid-until
            apt-get update
            apt-get install -y --no-install-recommends \
              build-essential wget ca-certificates \
              zlib1g-dev libffi-dev libssl-dev libbz2-dev \
              libreadline-dev libsqlite3-dev liblzma-dev libncurses5-dev

            PY_VERSION=3.12.7
            PY_BUILD_JOBS="${PYTHON_BUILD_JOBS:-2}"
            PY_BUILD_ROOT=/tmp/python-build
            rm -rf "$PY_BUILD_ROOT"
            mkdir -p "$PY_BUILD_ROOT"
            cd "$PY_BUILD_ROOT"

            wget -q https://www.python.org/ftp/python/${PY_VERSION}/Python-${PY_VERSION}.tgz
            tar -xzf Python-${PY_VERSION}.tgz
            cd Python-${PY_VERSION}
            ./configure --prefix=/usr/local/python3.12 --enable-shared --with-ensurepip=install
            make -j"$PY_BUILD_JOBS"
            make altinstall
            cd /repo

            export LD_LIBRARY_PATH="/usr/local/python3.12/lib:${LD_LIBRARY_PATH}"
            PYBIN=/usr/local/python3.12/bin/python3.12
            $PYBIN -m pip install --upgrade pip
            $PYBIN -m pip install -r requirements.txt
            $PYBIN -m pip install -e .
            $PYBIN -m pip install pyinstaller

            /usr/local/python3.12/bin/pyinstaller --onefile \
              --name jarvis \
              --add-data "config:config" \
              --add-data "config/.vimrc:config" \
              --add-data "config/authorized_keys:config" \
              --add-data "module:module" \
              --add-data "lib:lib" \
              --clean \
              src/jarvis/main.py
          '

      - name: 📦 Compress Binary
        run: |
          # Create zip and tar.gz of the single binary
          cd dist
          zip jarvis.zip jarvis
          tar -czvf jarvis.tar.gz jarvis

      - name: ✨ Create GitHub Release and Upload Assets
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            dist/jarvis.zip
            dist/jarvis.tar.gz
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
