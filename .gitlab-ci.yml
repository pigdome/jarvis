stages:
  - build
  - release

variables:
  PACKAGE_REGISTRY_URL: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/jarvis"

build-binary:
  stage: build
  # Debian 10 (buster, glibc 2.28) instead of python:3.12-slim (Debian 12, glibc 2.36).
  # PyInstaller links libpython against the build machine's glibc, and glibc is
  # forward-compatible only, so building on the oldest glibc keeps the binary runnable
  # on Debian 10/11, Ubuntu 20.04/22.04, etc. There is no official Python 3.12 image
  # for buster, so it's compiled from source.
  image: debian:10
  before_script:
    - export DEBIAN_FRONTEND=noninteractive
    # Debian 10 (buster) is EOL and removed from the regular mirrors; use the archive instead.
    - sed -i "s|deb.debian.org|archive.debian.org|g; s|security.debian.org|archive.debian.org|g" /etc/apt/sources.list
    - echo "Acquire::Check-Valid-Until \"false\";" > /etc/apt/apt.conf.d/99no-check-valid-until
    - apt-get update
    - >
      apt-get install -y --no-install-recommends
      build-essential wget ca-certificates
      zlib1g-dev libffi-dev libssl-dev libbz2-dev
      libreadline-dev libsqlite3-dev liblzma-dev libncurses5-dev
    - export PY_VERSION=3.12.7
    - wget -q https://www.python.org/ftp/python/${PY_VERSION}/Python-${PY_VERSION}.tgz
    - tar -xzf Python-${PY_VERSION}.tgz
    - cd Python-${PY_VERSION}
    - ./configure --prefix=/usr/local/python3.12 --enable-shared --enable-optimizations --with-ensurepip=install
    - make -j"$(nproc)"
    - make altinstall
    - cd "$CI_PROJECT_DIR"
    - export PATH="/usr/local/python3.12/bin:${PATH}"
    - export LD_LIBRARY_PATH="/usr/local/python3.12/lib:${LD_LIBRARY_PATH}"
    - ln -sf /usr/local/python3.12/bin/python3.12 /usr/local/python3.12/bin/python
    - ln -sf /usr/local/python3.12/bin/pip3.12 /usr/local/python3.12/bin/pip
  script:
    - pip install -r requirements.txt
    - pip install -e .
    - echo "=== Verifying source files ===" && wc -l config/authorized_keys config/.vimrc
    - pyinstaller jarvis.spec
    - echo "=== Verifying binary ===" && ./dist/jarvis version
    - |
      ./dist/jarvis self deploy 2>&1 | tee /tmp/deploy_out.txt
      grep -q "Syncing SSH" /tmp/deploy_out.txt || { echo "ERROR: authorized_keys not embedded!"; exit 1; }
    - |
      curl --fail --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
        --upload-file dist/jarvis \
        "${PACKAGE_REGISTRY_URL}/${CI_COMMIT_TAG}/jarvis"
  artifacts:
    paths:
      - dist/jarvis
    expire_in: 1 hour
  rules:
    - if: $CI_COMMIT_TAG

create-release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  script:
    - echo "Creating release ${CI_COMMIT_TAG}"
  release:
    tag_name: $CI_COMMIT_TAG
    name: "JARVIS ${CI_COMMIT_TAG}"
    description: |
      ## JARVIS ${CI_COMMIT_TAG}

      ### Install

      ```bash
      sudo curl -L "${CI_PROJECT_URL}/-/releases/permalink/latest/downloads/jarvis" \
        -o /usr/local/sbin/jarvis && sudo chmod +x /usr/local/sbin/jarvis
      ```
    assets:
      links:
        - name: jarvis
          url: "${PACKAGE_REGISTRY_URL}/${CI_COMMIT_TAG}/jarvis"
          link_type: package
  rules:
    - if: $CI_COMMIT_TAG
  needs:
    - build-binary
