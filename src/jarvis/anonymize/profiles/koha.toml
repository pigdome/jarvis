zipcode = "digits"
country = "text"
email = "email"
emailpro = "email"
phone = "phone"
mobile = "phone"
phonepro = "phone"
fax = "null"
B_streetnumber = "digits"
B_streettype = "text"
B_address = "text"
B_address2 = "text"
B_city = "text"
B_state = "text"
B_zipcode = "digits"
B_country = "text"
B_email = "email"
B_phone = "phone"
dateofbirth = "date"
debarredcomment = "text"
contactname = "name"
contactfirstname = "name"
borrowernotes = "text"
opacnote = "text"
contactnote = "text"
sort1 = "id"
sort2 = "id"
altcontactfirstname = "name"
altcontactsurname = "name"
altcontactaddress1 = "text"
