# Koha ILS — MySQL/MariaDB (mysqldump)
# Source: koha-source/installer/data/mysql/kohastructure.sql (Koha 26.06)
# Keys kept: borrowernumber and every FK to it, branchcode, categorycode.

[profile]
name = "koha"
engine = "mysql"
description = "Koha ILS patrons, staff, notices, logs"

truncate = [
  # sessions / tokens / credentials
  "sessions", "oauth_access_tokens", "api_keys", "borrower_password_recovery",
  "virtualshelfshares",
  # full PII copies and caches
  "borrower_modifications", "tmp_holdsqueue", "pending_offline_operations",
  # logs and rendered notices
  "action_logs", "message_queue", "search_history", "linktracker",
  "saved_reports", "problem_reports",
  # photos / ID scans (blobs cannot be rewritten)
  "patronimage", "borrower_files",
  # statistics with quasi-identifiers
  "pseudonymized_transactions", "pseudonymized_metadata_values",
  "pseudonymized_borrower_attributes",
]

[tables.borrowers]
cardnumber = { strategy = "digits", unique = true }
userid = { strategy = "id", unique = true }
surname = "name"
firstname = "name"
preferred_name = "name"
middle_name = "name"
othernames = "name"
initials = "name"
streetnumber = "digits"
streettype = "text"
address = "text"
address2 = "text"
city = "text"
state = "text"
zipcode = "digits"
country = "text"
email = "email"
emailpro = "email"
phone = "phone"
mobile = "phone"
phonepro = "phone"
fax = "null"
B_streetnumber = "digits"
B_streettype = "text"
B_address = "text"
B_address2 = "text"
B_city = "text"
B_state = "text"
B_zipcode = "digits"
B_country = "text"
B_email = "email"
B_phone = "phone"
dateofbirth = "date"
debarredcomment = "text"
contactname = "name"
contactfirstname = "name"
borrowernotes = "text"
opacnote = "text"
contactnote = "text"
sort1 = "id"                  # often student/staff ID in Thai sites
sort2 = "id"
altcontactfirstname = "name"
altcontactsurname = "name"
altcontactaddress1 = "text"
altcontactaddress2 = "text"
altcontactaddress3 = "text"
altcontactstate = "text"
altcontactzipcode = "digits"
altcontactcountry = "text"
altcontactphone = "phone"
smsalertnumber = "phone"
password = "password"
secret = "null"               # 2FA seed
overdrive_auth_token = "null"

# deletedborrowers: same columns, no unique keys
