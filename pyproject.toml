[project]
name = "jarvis-cli"
version = "3.0.27"
description = "JARVIS - Tools for life hack"
authors = [
    {name = "Apirak", email = "apirak@punsarn.asia"}
]
dependencies = [
    "typer[all]",
    "shellingham",
    "rich",
]

[project.scripts]
jarvis = "jarvis.main:app"

[tool.setuptools.package-data]
"jarvis.anonymize" = ["profiles/*.toml", "profiles/*.md"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
